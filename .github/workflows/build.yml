name: Build LG V60 Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
    - name: Persiapan Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev libssl-dev binfmt-support ccache crossbuild-essential-arm64 git zip unzip curl patch python3

    - name: Ambil Source Kernel
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_kernel_lge_sm8250.git kernel-source
        
    - name: Ambil Google Clang
      run: |
        mkdir clang
        cd clang
        curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang-r522817.tar.gz

    - name: Pasang KernelSU dan SUSFS (Sistem Live Radar)
      run: |
        cd kernel-source
        # 1. Pasang KernelSU
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # 2. FITUR RADAR: Mencari repo SUSFS yang masih aktif di GitHub
        echo "Menyalakan radar pencarian SUSFS di database GitHub..."
        REPO_URL=$(curl -s "https://api.github.com/search/repositories?q=susfs4ksu&sort=updated" | grep -o '"clone_url": "[^"]*' | head -n 1 | sed 's/"clone_url": "//')
        
        if [ -n "$REPO_URL" ] && [ "$REPO_URL" != "null" ]; then
          echo "Radar fungsional! Menemukan mirror aktif: $REPO_URL"
          git clone --depth=1 "$REPO_URL" susfs4ksu
        else
          echo "Kata kunci pertama gagal, mencoba radar alternatif..."
          REPO_URL_ALT=$(curl -s "https://api.github.com/search/repositories?q=susfs+kernel&sort=updated" | grep -o '"clone_url": "[^"]*' | head -n 1 | sed 's/"clone_url": "//')
          git clone --depth=1 "$REPO_URL_ALT" susfs4ksu
        fi
        
        # 3. Menyalin file inti SUSFS ke sistem kernel
        mkdir -p fs include/linux
        cp susfs4ksu/kernel/fs/susfs.c fs/ 2>/dev/null || cp susfs4ksu/fs/susfs.c fs/ 2>/dev/null || true
        cp susfs4ksu/kernel/include/linux/susfs.h include/linux/ 2>/dev/null || cp susfs4ksu/include/linux/susfs.h include/linux/ 2>/dev/null || true
        
        # 4. Mencari dan menerapkan patch 4.19 secara otomatis
        PATCH_419=$(find susfs4ksu/ -type f -name "*4.19*.patch" | head -n 1)
        if [ -f "$PATCH_419" ]; then
          patch -p1 < "$PATCH_419" || true
        else
          cp susfs4ksu/kernel_patches/4.19.y/* ./ 2>/dev/null || true
        fi

    - name: Masak Kernel
      run: |
        cd kernel-source
        
        # Kunci 1: Membungkam total seluruh skrip deteksi internal kernel yang rewel
        echo "Menjinakkan skrip pembaca versi bawaan kernel..."
        
        echo '#!/bin/sh' > scripts/as-version.sh
        echo 'echo 24000' >> scripts/as-version.sh
        chmod +x scripts/as-version.sh
        
        echo '#!/bin/sh' > scripts/clang-version.sh
        echo 'echo 180000' >> scripts/clang-version.sh
        chmod +x scripts/clang-version.sh

        echo '#!/bin/sh' > scripts/gcc-version.sh
        echo 'echo 100000' >> scripts/gcc-version.sh
        chmod +x scripts/gcc-version.sh

        echo '#!/bin/sh' > scripts/cc-name.sh
        echo 'echo Clang' >> scripts/cc-name.sh
        chmod +x scripts/cc-name.sh

        # Kunci 2: Operasi Intelijen Python untuk membedah dan membersihkan init/Kconfig secara real-time
        python3 -c "
        with open('init/Kconfig', 'r') as f:
            lines = f.readlines()
        print('=== ISI KCONFIG ASLI (BARIS 45-75) ===')
        for i in range(44, min(75, len(lines))):
            print(f'{i+1}: {lines[i]}', end='')
        print('======================================')
        for i in range(len(lines)):
            if 'option env' in lines[i]:
                print(f'Mendeteksi dan mematikan baris ilegal usang di baris {i+1}')
                lines[i] = '# ' + lines[i]
        with open('init/Kconfig', 'w') as f:
            f.writelines(lines)
        "
        
        # Menghubungkan lingkungan Clang ke sistem kompilasi
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export LLVM=1
        export LLVM_IAS=1
        
        # Membuat file konfigurasi utama
        make vendor/timelm-perf_defconfig
        
        # Mulai proses memasak utama
        make -j$(nproc --all)

    - name: Bungkus Jadi ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp kernel-source/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp kernel-source/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 ../Kernel-LGV60-SuKiSu-Ultra.zip *

    - name: Kirim Hasil ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-LGV60-Output
        path: Kernel-LGV60-SuKiSu-Ultra.zip
