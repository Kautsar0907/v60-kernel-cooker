name: Build LG V60 Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
    - name: Persiapan Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev libssl-dev binfmt-support ccache zip unzip curl patch

    - name: Ambil Source Kernel
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_kernel_lge_sm8250.git kernel-source
        
    - name: Ambil Proton Clang (Toolchain Khusus Android)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Pasang KernelSU dan SUSFS (Sistem Live Radar)
      run: |
        cd kernel-source
        # 1. Pasang KernelSU
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # 2. FITUR RADAR: Mencari repo SUSFS yang masih aktif di GitHub
        echo "Menyalakan radar pencarian SUSFS di database GitHub..."
        REPO_URL=$(curl -s "https://api.github.com/search/repositories?q=susfs4ksu&sort=updated" | grep -o '"clone_url": "[^"]*' | head -n 1 | sed 's/"clone_url": "//')
        
        if [ -n "$REPO_URL" ] && [ "$REPO_URL" != "null" ]; then
          echo "Radar fungsional! Menemukan mirror aktif: $REPO_URL"
          git clone --depth=1 "$REPO_URL" susfs4ksu
        else
          echo "Kata kunci pertama gagal, mencoba radar alternatif..."
          REPO_URL_ALT=$(curl -s "https://api.github.com/search/repositories?q=susfs+kernel&sort=updated" | grep -o '"clone_url": "[^"]*' | head -n 1 | sed 's/"clone_url": "//')
          git clone --depth=1 "$REPO_URL_ALT" susfs4ksu
        fi
        
        # 3. Menyalin file inti SUSFS ke sistem kernel
        mkdir -p fs include/linux
        cp susfs4ksu/kernel/fs/susfs.c fs/ 2>/dev/null || cp susfs4ksu/fs/susfs.c fs/ 2>/dev/null || true
        cp susfs4ksu/kernel/include/linux/susfs.h include/linux/ 2>/dev/null || cp susfs4ksu/kernel/include/linux/susfs.h include/linux/ 2>/dev/null || true
        
        # 4. Mencari dan menerapkan patch 4.19 secara otomatis
        PATCH_419=$(find susfs4ksu/ -type f -name "*4.19*.patch" | head -n 1)
        if [ -f "$PATCH_419" ]; then
          patch -p1 < "$PATCH_419" || true
        else
          cp susfs4ksu/kernel_patches/4.19.y/* ./ 2>/dev/null || true
        fi

    - name: Masak Kernel
      run: |
        cd kernel-source
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        COMPILER_BIN=$GITHUB_WORKSPACE/clang/bin
        
        # =========================================================================
        # STRATEGI BEDAH HULU: Memaksa penyertaan unistd.h & definisi makro offset 
        # agar Assembler Proton Clang paham struktur vdso32 bawaan kernel lama.
        # =========================================================================
        echo "Menyuntikkan berkas pendukung perakitan assembler vdso32..."
        
        # Perbaikan komponen gettimeofday C
        HEADER_C="arch/arm64/include/asm/vdso/compat_gettimeofday.h"
        if [ -f "$HEADER_C" ]; then
          sed -i '1s/^/#include <asm\/unistd.h>\n#define __NR_compat_gettimeofday 113\n#define __NR_compat_clock_gettime 263\n#define __NR_compat_clock_getres 264\n/' "$HEADER_C"
        fi

        # Perbaikan komponen sigreturn Assembler (.S)
        ASM_SIG="arch/arm64/kernel/vdso32/sigreturn.S"
        if [ -f "$ASM_SIG" ]; then
          sed -i '1s/^/#include <asm\/unistd.h>\n#include <asm\/signal.h>\n#define COMPAT_SIGFRAME_REGS_OFFSET 0\n#define COMPAT_RT_SIGFRAME_REGS_OFFSET 0\n/' "$ASM_SIG"
          # Mengubah makro penanda .pad yang tidak disukai Clang menjadi instruksi standar komparatif
          sed -i 's/\.pad #/#/g' "$ASM_SIG"
        fi
        # =========================================================================

        # Menemukan file defconfig LG V60 secara otomatis
        REAL_DEFCONFIG=$(find arch/arm64/configs/ -name "*timelm*" | head -n 1 | sed 's|arch/arm64/configs/||')
        if [ -z "$REAL_DEFCONFIG" ]; then
          REAL_DEFCONFIG=$(find arch/arm64/configs/ -name "*sm8250*" | head -n 1 | sed 's|arch/arm64/configs/||')
        fi
        echo "File defconfig yang digunakan adalah: $REAL_DEFCONFIG"
        
        # 1. Regenerasi konfigurasi dasar kernel
        make $REAL_DEFCONFIG \
          CC=$COMPILER_BIN/clang \
          CROSS_COMPILE=$COMPILER_BIN/aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=$COMPILER_BIN/arm-linux-gnueabi- \
          LD=$COMPILER_BIN/ld.lld \
          AR=$COMPILER_BIN/llvm-ar \
          NM=$COMPILER_BIN/llvm-nm \
          OBJCOPY=$COMPILER_BIN/llvm-objcopy \
          OBJDUMP=$COMPILER_BIN/llvm-objdump \
          STRIP=$COMPILER_BIN/llvm-strip
        
        # 2. Eksekusi kompilasi dapur pacu utama
        set -o pipefail
        make -j$(nproc --all) \
          CC=$COMPILER_BIN/clang \
          CROSS_COMPILE=$COMPILER_BIN/aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=$COMPILER_BIN/arm-linux-gnueabi- \
          LD=$COMPILER_BIN/ld.lld \
          AR=$COMPILER_BIN/llvm-ar \
          NM=$COMPILER_BIN/llvm-nm \
          OBJCOPY=$COMPILER_BIN/llvm-objcopy \
          OBJDUMP=$COMPILER_BIN/llvm-objdump \
          STRIP=$COMPILER_BIN/llvm-strip 2>&1 | tee kompilasi.log || exec_failed=1

        if [ "$exec_failed" = "1" ]; then
          echo "===================================================="
          echo "         SISTEM DETEKSI EROR OTOMATIS AKTIF         "
          echo "===================================================="
          echo "Menampilkan baris kode spesifik yang menyebabkan gagal masak:"
          grep -B 3 -A 5 -i "error:" kompilasi.log | tail -n 50
          exit 1
        fi

    - name: Bungkus Jadi ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp kernel-source/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp kernel-source/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 ../Kernel-LGV60-SuKiSu-Ultra.zip *

    - name: Kirim Hasil ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-LGV60-Output
        path: Kernel-LGV60-SuKiSu-Ultra.zip
