name: Build LG V60 Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
    - name: Persiapan Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev libssl-dev binfmt-support ccache crossbuild-essential-arm64 git zip unzip curl patch

    - name: Ambil Source Kernel
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_kernel_lge_sm8250.git kernel-source
        
    - name: Ambil Google Clang
      run: |
        mkdir clang
        cd clang
        curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang-r522817.tar.gz
        cd ..
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gas/linux-x86 gcc-gas

    - name: Pasang KernelSU dan SUSFS
      run: |
        cd kernel-source
        # 1. Pasang KernelSU
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # 2. Pasang SUSFS menggunakan GitHub Mirror (Bypass GitLab Login)
        git clone --depth=1 https://github.com/ashsc/susfs4ksu.git
        cp susfs4ksu/kernel/fs/susfs.c fs/
        cp susfs4ksu/kernel/include/linux/susfs.h include/linux/
        
        # 3. Terapkan Patch SUSFS Khusus Kernel 4.19
        patch -p1 < susfs4ksu/kernel_patches/4.19.y/50_add_susfs_in_kernel-4.19.y.patch || true

    - name: Masak Kernel
      run: |
        cd kernel-source
        export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc-gas:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        make O=out vendor/timelm-perf_defconfig
        make -j$(nproc --all) O=out

    - name: Bungkus Jadi ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 ../Kernel-LGV60-SuKiSu-Ultra.zip *

    - name: Kirim Hasil ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-LGV60-Output
        path: Kernel-LGV60-SuKiSu-Ultra.zip
