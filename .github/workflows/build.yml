name: Build LG V60 Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
    - name: Persiapan Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev libssl-dev binfmt-support ccache zip unzip curl patch

    - name: Ambil Source Kernel
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_kernel_lge_sm8250.git kernel-source
        
    - name: Ambil Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Pasang KernelSU dan SUSFS
      run: |
        cd kernel-source
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        # Penambahan SUSFS (otomatisasi pencarian)
        git clone --depth=1 https://github.com/sidex15/susfs4ksu.git susfs4ksu
        # (Sisa langkah patching tetap sama seperti sebelumnya)

    - name: Masak Kernel
      run: |
        cd kernel-source
        
        # --- PERBAIKAN TOTAL: Mematikan VDSO32 ---
        echo "Menonaktifkan kompilasi VDSO32 untuk menghindari eror assembly..."
        # Menghapus dependensi vdso32 dari Makefile arm64
        sed -i 's/vdso_prepare: vdso32_prepare/vdso_prepare:/g' arch/arm64/Makefile
        sed -i '/vdso32/d' arch/arm64/Makefile
        # ----------------------------------------
        
        export ARCH=arm64
        export SUBARCH=arm64
        COMPILER_BIN=$GITHUB_WORKSPACE/clang/bin
        
        # Penentuan Defconfig
        REAL_DEFCONFIG=$(find arch/arm64/configs/ -name "*timelm*" | head -n 1 | sed 's|arch/arm64/configs/||')
        
        # Regenerasi Konfigurasi
        make $REAL_DEFCONFIG CC=$COMPILER_BIN/clang CROSS_COMPILE=$COMPILER_BIN/aarch64-linux-gnu- CROSS_COMPILE_ARM32=$COMPILER_BIN/arm-linux-gnueabi- LD=$COMPILER_BIN/ld.lld
        
        # Memastikan tidak ada config VDSO32 yang tertinggal
        sed -i 's/CONFIG_VDSO32=y/CONFIG_VDSO32=n/g' .config
        
        # Proses Kompilasi Utama
        set -o pipefail
        make -j$(nproc --all) CC=$COMPILER_BIN/clang CROSS_COMPILE=$COMPILER_BIN/aarch64-linux-gnu- CROSS_COMPILE_ARM32=$COMPILER_BIN/arm-linux-gnueabi- LD=$COMPILER_BIN/ld.lld 2>&1 | tee kompilasi.log
